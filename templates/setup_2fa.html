<!DOCTYPE html>
<html>
<head>
    <title>Setup Google Authenticator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }

        img {
            background: white;
            padding: 10px;
            width: 220px;
        }

        a {
            color: #60a5fa;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Setup Two-Factor Authentication</h1>

    <p>
        Scan this QR code using Google Authenticator.
    </p>

    <img
        src="/static/totp_qr.png"
        alt="Authenticator QR Code"
    >

    <p>
        After scanning, return to the login page.
    </p>

    <a href="/">
        Go to Login
    </a>

</div>

</body>
</html>
