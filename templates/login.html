<!DOCTYPE html>
<html>
<head>
    <title>Security Lab Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 350px;
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #94a3b8;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .error {
            background: #7f1d1d;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Sign In</h1>

    <p>Security Authentication Lab</p>

    <form method="POST">

        <input
            name="username"
            placeholder="Username"
            required
        >

        <input
            name="password"
            type="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Continue
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
